spring.application.name=asistencia-en-carretera

# MongoDB: la cadena de conexion viene de la variable de entorno MONGODB_URI (obligatoria, sin valor por defecto).
# Incluye usuario, clave y nombre de la base. Ver .env.example y el README.
# Ejemplo local: mongodb://taller_app:clave@localhost:27017/asistencia_en_carretera?authSource=asistencia_en_carretera
spring.mongodb.uri=${MONGODB_URI}

# Seguridad JWT: JWT_SECRET debe tener 32 o mas caracteres (genera una con: openssl rand -base64 48)
jwt.secret=${JWT_SECRET}

# Zona horaria del negocio: las citas se guardan en UTC y esta zona define el horario de atencion de cada dia
app.zona-horaria=${APP_TZ:America/Bogota}
# Minutos de vida del token (y de la cookie)
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
# true cuando la app se sirva por HTTPS
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# Valoraciones verificadas: true = solo se valora un taller tras una cita completada (una valoracion por visita)
app.valoraciones.exigir-cita-completada=${VALORACIONES_EXIGIR_CITA:true}

# Redes sociales de la empresa (pie de pagina). Cambialas por las cuentas reales
app.redes.facebook=${REDES_FACEBOOK:https://www.facebook.com/}
app.redes.x=${REDES_X:https://x.com/}
app.redes.instagram=${REDES_INSTAGRAM:https://www.instagram.com/}
