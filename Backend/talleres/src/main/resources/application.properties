spring.application.name=asistencia-en-carretera

# MySQL: lee variables de entorno (Docker) y si no existen usa el valor por defecto (ejecucion local).
# Local: ejecutar sql/01_crear_usuario_mysql.sql y sql/02_asistencia_en_carretera.sql
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:asistencia_en_carretera}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=${DB_TIMEZONE:America/Bogota}
spring.datasource.username=${DB_USER:taller_app}
spring.datasource.password=${DB_PASSWORD:taller123}

