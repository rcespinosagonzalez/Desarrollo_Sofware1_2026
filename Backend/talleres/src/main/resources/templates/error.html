<!DOCTYPE html>
<!-- Pagina de error para las vistas HTML (Spring Boot la usa para 403, 404, 500...) -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algo salió mal | Asistencia en carretera</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="shortcut icon" th:href="@{/css/img/logo.ico}" />
</head>
<body>
    <div class="contenedor-inicio-sesion">
        <div class="tarjeta-inicio-sesion">
            <div class="encabezado-inicio-sesion">
                <h2 th:text="${status == 404} ? 'Página no encontrada' : 'Algo salió mal'">Algo salió mal</h2>
                <p th:text="${status == 404} ? 'La página que buscas no existe.' : 'Ocurrió un error inesperado. Intenta de nuevo en un momento.'">Ocurrió un error inesperado.</p>
            </div>
            <div class="contenedor-registro">
                <a th:href="@{/}" class="enlace-registro">Volver al inicio</a>
            </div>
        </div>
    </div>
</body>
</html>
