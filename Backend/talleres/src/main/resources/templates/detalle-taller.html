<!DOCTYPE html>
<!-- Ficha de un taller y lista de valoraciones (parametro id en URL) -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia en carretera — Taller</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="marco-pagina cliente-barra-superior vista-detalle-taller pagina-ancho-completo" data-pantalla="detalle-taller" data-rol="user">
    <header class="barra-superior-cliente">
        <a href="/buscar-talleres" class="barra-marca">← Mapa</a>
        <nav class="barra-superior-acciones" aria-label="Sesión">
            <a href="/logout">Salir</a>
        </nav>
    </header>
    <main class="contenido-principal" th:if="${taller != null}">
        <header class="cabecera-buscar">
            <h1 th:text="${taller.nombre}">Taller</h1>
            <p class="texto-secundario cabecera-busqueda-sub" th:text="${taller.direccion}">Dirección</p>
        </header>
        <div class="tarjeta ficha-taller-detalle">
            <p><strong>Teléfono:</strong> <span th:text="${taller.telefono}">—</span></p>
            <p><strong>Horario:</strong> <span th:text="${taller.horario}">—</span></p>
            <p><strong>Servicios:</strong> <span th:text="${taller.servicios}">—</span></p>
            <p><strong>Descripción:</strong> <span th:text="${taller.descripcion}">—</span></p>
            <p th:if="${taller.numValoraciones > 0}">
                <strong>Promedio:</strong>
                <span th:text="|${#numbers.formatDecimal(taller.calificacionPromedio, 1, 1)} / 5 · ${taller.numValoraciones} valoraciones|">—</span>
            </p>
            <p th:if="${taller.numValoraciones == 0}" class="texto-secundario">Sin valoraciones en la base de datos.</p>
            <section th:if="${valoracionesTaller != null && !#lists.isEmpty(valoracionesTaller)}" class="lista-valoraciones-taller">
                <h2 class="subtitulo-seccion">Valoraciones (MySQL)</h2>
                <article class="tarjeta tarjeta-valoracion-item" th:each="v : ${valoracionesTaller}">
                    <p><strong th:text="${v.cliente}">Cliente</strong> · <span th:text="|${v.estrellas}/5 ★|">—</span></p>
                    <p class="texto-secundario" th:text="${v.comentario}">—</p>
                    <p class="texto-secundario" th:text="${v.fecha}">—</p>
                </article>
            </section>
            <p class="fila-acciones-ficha">
                <a th:href="|/buscar-talleres?tallerCita=${taller.id}&ver=solicitar|" class="boton-principal">Pedir cita</a>
                <a href="/buscar-talleres#seccion-mapa" class="boton-secundario">Mapa</a>
            </p>
        </div>
    </main>
    <main class="contenido-principal" th:if="${taller == null}">
        <h1>Taller no encontrado</h1>
        <p class="texto-secundario">Taller no disponible.</p>
        <a th:href="@{/buscar-talleres}" class="boton-principal">Mapa</a>
    </main>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
